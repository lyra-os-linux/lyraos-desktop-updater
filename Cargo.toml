[workspace]
resolver = "2"
members = ["core", "protocol", "cli", "service", "offline", "verifier", "probe", "src-tauri"]
default-members = ["core", "protocol", "cli", "service", "offline", "verifier", "probe", "src-tauri"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/lyra-os-linux/lyraos-desktop-updater"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
