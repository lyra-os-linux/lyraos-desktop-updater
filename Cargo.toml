[workspace]
resolver = "2"
members = ["core", "protocol", "cli", "service", "offline", "verifier", "src-tauri"]
default-members = ["core", "protocol", "cli", "service", "offline", "verifier", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/britors/Lyra"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
